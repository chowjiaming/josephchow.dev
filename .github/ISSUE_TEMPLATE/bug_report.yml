name: Bug on the live site
description: Something wrong on josephchow.dev
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Page where you saw the issue (e.g. /zh-hans/)
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser / device
    validations:
      required: false
